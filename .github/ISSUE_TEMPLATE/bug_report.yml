name: Bug report
description: Something is broken or a calculation looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include your inputs (band, step, scheme, schedule, retirement age) and the result you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: For calculation errors, link an official source (NHSBSA, NHS Employers, HMRC).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
